<!doctype html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Sapaloka</title>
<style>
:root{--bg:#f6f7f5;--card:#fff;--text:#17211f;--muted:#5d6b68;--line:#dfe5e2;--accent:#0f766e;--on:#fff;--me:#d3efe9;--warm:#c2410c}
body.dark{--bg:#0f1514;--card:#192220;--text:#eaf2f0;--muted:#9db0ac;--line:#2a3835;--accent:#2dd4bf;--on:#042f2a;--me:#14463f;--warm:#fb923c}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,sans-serif}
#app{display:flex;flex-direction:column;height:100%;max-width:600px;margin:auto}
header{display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);min-height:58px}
header h1{font-size:20px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
main{flex:1;overflow-y:auto}
button,input,textarea{font:inherit;color:inherit;background:none;border:0}button{cursor:pointer}
.btn{background:var(--accent);color:var(--on);border-radius:10px;padding:10px 16px;font-weight:700}
.ghost{border:1px solid var(--line);border-radius:10px;padding:10px 16px}
.danger{color:var(--warm)}
input[type=text],textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.row{display:flex;gap:12px;align-items:center;padding:12px 16px;width:100%;text-align:left;border-bottom:1px solid var(--line)}
.grow{flex:1;min-width:0}.cut{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.muted{color:var(--muted);font-size:13px}
.av{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--on);display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden;flex:none}
.av img{width:100%;height:100%;object-fit:cover}.av.big{width:84px;height:84px;font-size:30px}
.stories{display:flex;gap:14px;overflow-x:auto;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.stories button{width:64px;flex:none;font-size:12px;display:flex;flex-direction:column;align-items:center;gap:4px}
.ring{padding:3px;border-radius:50%;border:2px solid var(--line)}.ring.new{border-color:var(--warm)}
.post{background:var(--card);margin-bottom:10px;border-bottom:1px solid var(--line)}.post .row{border:0}
.post>img{width:100%;display:block;max-height:80vh;object-fit:cover}.pad{padding:10px 16px}
.acts{display:flex;gap:18px}.liked{color:var(--warm);font-weight:700}
.form{display:flex;gap:8px;padding:8px 16px 12px}
#msgs{padding:12px;display:flex;flex-direction:column;gap:8px}
.m{max-width:80%;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;overflow-wrap:anywhere}
.m.me{align-self:flex-end;background:var(--me)}.m img{max-width:100%;border-radius:8px;display:block}.m small{display:block;text-align:right;color:var(--muted);font-size:11px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}.grid img{width:100%;aspect-ratio:1;object-fit:cover}
.center{text-align:center;padding:24px 16px;display:flex;flex-direction:column;gap:12px;align-items:center}
.note{background:var(--me);padding:8px 16px;font-size:13px}
#story{position:fixed;inset:0;background:#000;color:#fff;display:flex;flex-direction:column;justify-content:center;z-index:5}
#story img{max-width:100%;max-height:80%;object-fit:contain}#story div{padding:16px;display:flex;justify-content:space-between}
[hidden]{display:none!important}
#toast{position:fixed;bottom:90px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:9;max-width:90%}
#app{position:relative}
main.pad-nav{padding-bottom:96px}
#nav{position:absolute;left:12px;right:12px;bottom:12px;height:68px;display:flex;padding:5px;border-radius:40px;touch-action:none;user-select:none;z-index:3;
background:linear-gradient(180deg,rgba(255,255,255,.55),rgba(255,255,255,.28));-webkit-backdrop-filter:blur(14px) saturate(1.9);backdrop-filter:blur(14px) saturate(1.9);
border:1px solid rgba(255,255,255,.7);box-shadow:0 8px 28px rgba(0,0,0,.2),inset 0 1px 1px rgba(255,255,255,.9),inset 0 -6px 14px rgba(255,255,255,.25)}
body.dark #nav,#nav.onvideo{background:linear-gradient(180deg,rgba(60,70,72,.55),rgba(18,24,24,.45));border-color:rgba(255,255,255,.18);box-shadow:0 8px 28px rgba(0,0,0,.45),inset 0 1px 1px rgba(255,255,255,.25)}
#nav.onvideo button{color:#fff}#nav.onvideo button.on{color:#5eead4}
#nav button{flex:1;position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--text);transition:color .2s}
#nav button.on{color:var(--accent);font-weight:700}
#nav svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
#nav button.on svg{transform:scale(1.12)}
#lens{position:absolute;z-index:1;top:5px;bottom:5px;left:5px;width:calc((100% - 10px)/5);border-radius:34px;pointer-events:none;
background:radial-gradient(120% 90% at 50% 0%,rgba(255,255,255,.55),rgba(255,255,255,.08) 60%),rgba(120,140,140,.18);
box-shadow:inset 0 0 0 1px rgba(255,255,255,.55),inset 6px 0 10px -6px rgba(0,200,255,.75),inset -6px 0 10px -6px rgba(255,120,40,.75),inset 0 -5px 9px -5px rgba(190,90,255,.6),0 3px 10px rgba(0,0,0,.14);
transition:transform .45s cubic-bezier(.3,1.5,.5,1),scale .22s}
#lens.move{scale:1.14 1.22}
#lens.drag{transition:scale .22s}
.ico{border:1px solid var(--line);border-radius:10px;padding:10px 12px;flex:none}
.rec{color:var(--warm);font-weight:700;flex:1;align-self:center}
audio{max-width:230px;width:100%;display:block}
#vids{height:100%;overflow-y:auto;scroll-snap-type:y mandatory;background:#000;color:#fff}
.vid{height:100%;scroll-snap-align:start;scroll-snap-stop:always;position:relative}
.vid video{width:100%;height:100%;object-fit:contain}
.vinfo{position:absolute;left:16px;right:90px;bottom:96px;text-shadow:0 1px 4px #000;overflow-wrap:anywhere}
.vacts{position:absolute;right:10px;bottom:96px;display:flex;flex-direction:column;gap:10px}
.vacts button{background:rgba(0,0,0,.45);color:#fff;border-radius:20px;padding:9px 12px;font-size:13px}
.vacts button.liked{color:#fb923c}
#story{z-index:5}
</style></head><body>
<div id="app"><header></header><main></main><div id="foot"></div><div id="nav" role="navigation"><div id="lens"></div></div></div>
<div id="story" hidden></div><div id="toast" hidden></div>
<input type="file" id="file" accept="image/*" hidden>
<script>
var KEY='sapaloka-v1',DAY=864e5;
function seed(){var n=Date.now();return{dark:false,me:{name:'Saya',bio:'Halo, saya pakai Sapaloka.',photo:''},
chats:[{id:'a',name:'Rani (contoh)',u:'rani.contoh',msgs:[{t:'Hai! Saya akun contoh, balasan saya otomatis. Coba kirim pesan atau foto.',me:false,at:n}]},
{id:'b',name:'Catatan Saya',u:'catatan.saya',msgs:[]}],posts:[],stories:[]}}
var S;try{S=JSON.parse(localStorage.getItem(KEY))||seed()}catch(e){S=seed()}
var view={tab:'chat',chat:null},storyOpen=null;
function slug(n){return String(n).toLowerCase().replace(/[^a-z0-9._]+/g,'.').replace(/^\.+|\.+$/g,'').slice(0,20)||'teman'}
function migrate(){if(!S.me.user)S.me.user='saya';S.chats.forEach(function(c){if(!c.u)c.u=slug(c.name)})}
migrate();
var TABS=[['chat','Obrolan','<path d="M4 5h16v11H9l-5 4z"/>'],['video','Video','<rect x="3" y="4" width="18" height="16" rx="4"/><path d="M10 9l5 3-5 3z"/>'],['feed','Beranda','<path d="M4 11l8-7 8 7v9H4z"/>'],['search','Cari','<circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>'],['me','Profil','<circle cx="12" cy="8" r="4"/><path d="M4 21c1-5 15-5 16 0"/>']];
/* video disimpan di IndexedDB karena terlalu besar untuk localStorage */
var vids=[],vurls={},muted=true,watcher=null;
function db(mode,fn,done){var r=indexedDB.open('sapaloka',1);r.onupgradeneeded=function(){r.result.createObjectStore('v',{keyPath:'id'})};
r.onerror=function(){toast('Penyimpanan video tidak tersedia')};
r.onsuccess=function(){var d=r.result,t=d.transaction('v',mode),q=fn(t.objectStore('v'));t.oncomplete=function(){d.close();if(done)done(q&&q.result)};t.onabort=function(){d.close();toast('Video gagal disimpan. Memori mungkin penuh.')}}}
function loadVids(){db('readonly',function(o){return o.getAll()},function(a){vids=a.sort(function(x,y){return y.at-x.at});if(view.tab==='video'&&!view.chat)render()})}
/* pesan suara direkam oleh kode Android */
var rec=null;
function stopRec(keep){if(!rec)return;clearInterval(rec.timer);var sec=Math.round((Date.now()-rec.at)/1000);rec=null;var d=window.Android.stopRec();
if(keep){if(d)send({audio:d,sec:Math.max(1,sec)});else toast('Rekaman terlalu pendek')}render()}
window.cancelRec=function(){stopRec(false)};
var $=function(q){return document.querySelector(q)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return'&#'+c.charCodeAt(0)+';'})}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));return true}catch(e){toast('Memori aplikasi penuh. Hapus beberapa foto.');return false}}
/* ubah data; batalkan jika tidak bisa disimpan */
function commit(fn){var old=JSON.stringify(S);fn();if(!save()){S=JSON.parse(old);return false}return true}
var tt;function toast(t){var e=$('#toast');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(function(){e.hidden=true},2500)}
function av(name,photo,cls){return'<span class="av '+(cls||'')+'">'+(photo?'<img alt="" src="'+photo+'">':esc(name.charAt(0).toUpperCase()))+'</span>'}
function time(a){return new Date(a).toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'})}
function date(a){return new Date(a).toLocaleDateString('id-ID',{day:'numeric',month:'short'})+' '+time(a)}
function pick(cb){var f=$('#file');f.accept='image/*';f.value='';f.onchange=function(){var file=f.files[0];if(!file)return;
var url=URL.createObjectURL(file),i=new Image();i.onload=function(){var k=Math.min(1,900/Math.max(i.width,i.height)),c=document.createElement('canvas');
c.width=Math.max(1,Math.round(i.width*k));c.height=Math.max(1,Math.round(i.height*k));var x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(i,0,0,c.width,c.height);
URL.revokeObjectURL(url);cb(c.toDataURL('image/jpeg',.72))};i.onerror=function(){toast('Foto tidak bisa dibuka')};i.src=url};f.click()}
function chat(){return S.chats.filter(function(c){return c.id===view.chat})[0]}
function preview(x){return x.audio?'[Pesan suara]':x.img?'[Foto]':esc(x.t)}
function bubble(x){return x.audio?'<audio controls src="'+x.audio+'"></audio><small>'+x.sec+' dtk</small>':x.img?'<img alt="Foto" src="'+x.img+'">':esc(x.t)}
function chatRow(c){var x=c.msgs[c.msgs.length-1];return'<button class="row" data-a="open" data-id="'+c.id+'">'+av(c.name)+'<span class="grow"><b>'+esc(c.name)+'</b><div class="muted cut">'+(x?preview(x):'@'+esc(c.u))+'</div></span>'+(x?'<span class="muted">'+time(x.at)+'</span>':'')+'</button>'}
function results(q){q=q.trim().toLowerCase().replace(/^@/,'');var l=S.chats.filter(function(c){return !q||c.u.indexOf(q)>=0||c.name.toLowerCase().indexOf(q)>=0});
var h=l.map(function(c){return'<button class="row" data-a="open" data-id="'+c.id+'">'+av(c.name)+'<span class="grow"><b>@'+esc(c.u)+'</b><div class="muted cut">'+esc(c.name)+'</div></span></button>'}).join('');
if(/^[a-z0-9._]{3,20}$/.test(q)&&!S.chats.some(function(c){return c.u===q}))h+='<div class="center"><p class="muted">@'+esc(q)+' belum ada di HP ini.</p><button class="btn" data-a="adduser" data-id="'+esc(q)+'">Simpan sebagai kontak</button></div>';
return h||'<div class="center muted">Tidak ditemukan.</div>'}
function render(){document.body.className=S.dark?'dark':'';if(watcher){watcher.disconnect();watcher=null}S.stories=S.stories.filter(function(s){return Date.now()-s.at<DAY});
var h=$('header'),m=$('main'),f=$('#foot'),c=view.chat&&chat(),nv=$('#nav');
nv.hidden=!!c;nv.className=!c&&view.tab==='video'?'onvideo':'';m.className=c||view.tab==='video'?'':'pad-nav';
if(c){h.innerHTML='<button data-a="back" aria-label="Kembali">&#8592;</button>'+av(c.name)+'<h1>'+esc(c.name)+'</h1><button class="danger" data-a="delchat">Hapus</button>';
m.innerHTML='<div id="msgs">'+(c.msgs.map(function(x){return'<div class="m '+(x.me?'me':'')+'">'+bubble(x)+'<small>'+time(x.at)+'</small></div>'}).join('')||'<p class="muted">Belum ada pesan.</p>')+'</div>';
f.innerHTML=rec?'<div class="form"><button class="ghost" data-a="reccancel">Batal</button><span class="rec">&#9679; Merekam <span id="sec">'+Math.round((Date.now()-rec.at)/1000)+'</span> dtk</span><button class="btn" data-a="recsend">Kirim</button></div>':'<form class="form" data-f="send"><button type="button" class="ico" data-a="sendphoto">Foto</button><button type="button" class="ico" data-a="record" aria-label="Rekam pesan suara">VN</button><input type="text" id="msg" placeholder="Tulis pesan" aria-label="Pesan" autocomplete="off"><button class="btn">Kirim</button></form>';
m.scrollTop=m.scrollHeight;return}
f.innerHTML='';var titles={chat:'Sapaloka',video:'Video',feed:'Beranda',search:'Cari',me:'Profil'};
h.innerHTML='<h1>'+titles[view.tab]+'</h1>'+(view.tab==='chat'?'<button class="btn" data-a="newchat">+ Obrolan</button>':view.tab==='feed'?'<button class="btn" data-a="newpost">+ Foto</button>':view.tab==='video'?'<button class="btn" data-a="newvideo">+ Video</button>':view.tab==='search'?'':'<button class="ghost" data-a="dark">'+(S.dark?'Terang':'Gelap')+'</button>');
if(view.tab==='chat'){var list=S.chats.slice().sort(function(a,b){return last(b)-last(a)});
m.innerHTML='<p class="note">Mode uji coba: data hanya tersimpan di HP ini. Pesan belum terkirim ke orang lain.</p>'+(list.map(chatRow).join('')||'<div class="center">Belum ada obrolan.</div>')}
else if(view.tab==='search'){m.innerHTML='<div class="pad"><input type="text" id="q" placeholder="Cari username, misalnya rani" aria-label="Cari username" autocapitalize="none" autocomplete="off"></div><p class="note">Saat ini hanya mencari kontak di HP ini. Mencari pengguna lain butuh server.</p><div id="res">'+results('')+'</div>';$('#q').oninput=function(){$('#res').innerHTML=results(this.value)}}
else if(view.tab==='video'){m.innerHTML=vids.length?'<div id="vids">'+vids.map(function(v){if(!vurls[v.id])vurls[v.id]=URL.createObjectURL(v.blob);return'<section class="vid"><video loop playsinline preload="metadata" '+(muted?'muted ':'')+'src="'+vurls[v.id]+'" data-a="playpause" data-id="'+v.id+'"></video><div class="vinfo"><b>@'+esc(S.me.user)+'</b><p>'+esc(v.text)+'</p></div><div class="vacts"><button class="'+(v.liked?'liked':'')+'" data-a="vlike" data-id="'+v.id+'">'+(v.liked?'&#9829; Disukai':'&#9825; Suka')+'</button><button data-a="sound">'+(muted?'Suara mati':'Suara aktif')+'</button><button data-a="vdel" data-id="'+v.id+'">Hapus</button></div></section>'}).join('')+'</div>':'<div class="center"><p>Belum ada video.</p><button class="btn" data-a="newvideo">Tambah video pertama</button><p class="muted">Maksimal 50 MB. Video tersimpan di HP ini saja.</p></div>';
if(vids.length){watcher=new IntersectionObserver(function(es){es.forEach(function(e){var v=e.target;if(e.intersectionRatio>.6){v.muted=muted;var p=v.play();if(p)p.catch(function(){})}else v.pause()})},{threshold:[0,.6,1]});document.querySelectorAll('video').forEach(function(v){v.muted=muted;watcher.observe(v)})}}
else if(view.tab==='feed'){m.innerHTML='<div class="stories"><button data-a="newstory"><span class="ring"><span class="av">+</span></span>Cerita</button>'+S.stories.map(function(s,i){return'<button data-a="story" data-id="'+s.id+'"><span class="ring new">'+av(S.me.name,s.img)+'</span>'+time(s.at)+'</button>'}).join('')+'</div>'+
(S.posts.map(function(p){return'<article class="post"><div class="row">'+av(S.me.name,S.me.photo)+'<span class="grow"><b>'+esc(S.me.name)+'</b><div class="muted">'+date(p.at)+'</div></span><button class="danger" data-a="delpost" data-id="'+p.id+'">Hapus</button></div><img alt="Foto unggahan" src="'+p.img+'"><div class="pad"><div class="acts"><button class="'+(p.liked?'liked':'')+'" data-a="like" data-id="'+p.id+'">'+(p.liked?'&#9829; Disukai':'&#9825; Suka')+'</button></div><p>'+esc(p.text)+'</p>'+p.comments.map(function(t){return'<p class="muted"><b>'+esc(S.me.name)+'</b> '+esc(t)+'</p>'}).join('')+'</div><form class="form" data-f="comment" data-id="'+p.id+'"><input type="text" placeholder="Tulis komentar" aria-label="Komentar"><button class="ghost">Kirim</button></form></article>'}).join('')||'<div class="center"><p>Belum ada foto.</p><button class="btn" data-a="newpost">Unggah foto pertama</button></div>')}
else{m.innerHTML='<div class="center">'+av(S.me.name,S.me.photo,'big')+'<button class="ghost" data-a="avatar">Ganti foto profil</button></div><form class="pad" data-f="profile"><label>Username<input type="text" id="user" maxlength="20" autocapitalize="none" value="'+esc(S.me.user)+'"></label><label>Nama<input type="text" id="name" maxlength="30" value="'+esc(S.me.name)+'"></label><label>Bio<input type="text" id="bio" maxlength="100" value="'+esc(S.me.bio)+'"></label><p style="margin-top:10px"><button class="btn">Simpan profil</button></p></form><p class="pad muted">'+S.posts.length+' unggahan</p><div class="grid">'+S.posts.map(function(p){return'<img alt="Unggahan" src="'+p.img+'">'}).join('')+'</div><div class="center"><button class="ghost danger" data-a="reset">Hapus semua data</button></div>'}
moveLens(index(view.tab))}
function index(t){for(var i=0;i<TABS.length;i++)if(TABS[i][0]===t)return i;return 0}
var lensAt=-1,lensTimer;
function moveLens(i){var l=$('#lens');l.style.transform='translateX('+i*100+'%)';
document.querySelectorAll('#nav button').forEach(function(b,n){b.className=n===i?'on':''});
if(lensAt!==i&&lensAt>=0){l.classList.add('move');clearTimeout(lensTimer);lensTimer=setTimeout(function(){l.classList.remove('move')},280)}lensAt=i}
function buildNav(){var n=$('#nav');n.insertAdjacentHTML('beforeend',TABS.map(function(t){return'<button data-tab="'+t[0]+'"><svg viewBox="0 0 24 24">'+t[2]+'</svg>'+t[1]+'</button>'}).join(''));
var drag=false,l=$('#lens');
function pos(e){var r=n.getBoundingClientRect(),w=(r.width-10)/5;return Math.max(0,Math.min(4,(e.clientX-r.left-5)/w-.5))}
n.addEventListener('pointerdown',function(e){drag=true;n.setPointerCapture(e.pointerId);l.classList.add('move');l.style.transform='translateX('+Math.round(pos(e))*100+'%)'});
n.addEventListener('pointermove',function(e){if(!drag)return;l.classList.add('drag');l.style.transform='translateX('+pos(e)*100+'%)'});
n.addEventListener('pointerup',function(e){if(!drag)return;drag=false;l.classList.remove('drag');var i=Math.round(pos(e));setTimeout(function(){l.classList.remove('move')},280);act.tab(TABS[i][0])});
n.addEventListener('pointercancel',function(){drag=false;l.classList.remove('drag','move');moveLens(index(view.tab))});
n.addEventListener('click',function(e){var b=e.target.closest('button');if(b&&e.detail===0)act.tab(b.getAttribute('data-tab'))})}
function last(c){var x=c.msgs[c.msgs.length-1];return x?x.at:0}
function send(msg){var c=chat(),id=c.id;if(!commit(function(){msg.me=true;msg.at=Date.now();c.msgs.push(msg)}))return false;render();
if(id==='a')setTimeout(function(){var r=S.chats.filter(function(c){return c.id==='a'})[0];if(!r)return;
var a=msg.audio?'Pesan suaramu masuk. (balasan otomatis)':msg.img?'Fotonya sudah saya terima. (balasan otomatis)':'Siap, pesanmu masuk. (balasan otomatis)';
if(commit(function(){r.msgs.push({t:a,me:false,at:Date.now()})})&&view.chat==='a'){var d=$('#msg'),v=d?d.value:'',focus=d===document.activeElement;render();d=$('#msg');if(d){d.value=v;if(focus)d.focus()}}},900);return true}
function find(a,id){return a.filter(function(x){return x.id===id})[0]}
var act={
tab:function(id){view.tab=id;view.chat=null;render();$('main').scrollTop=0},open:function(id){view.chat=id;render()},back:function(){stopRec(false);view.chat=null;render()},
record:function(){if(!window.Android){toast('Rekam suara hanya bisa di aplikasi Android');return}var r=window.Android.startRec();
if(r==='izin'){toast('Izinkan mikrofon, lalu tekan VN lagi');return}if(r!=='ok'){toast('Mikrofon tidak bisa dipakai');return}
rec={at:Date.now(),timer:setInterval(function(){var n=Math.round((Date.now()-rec.at)/1000),e=$('#sec');if(e)e.textContent=n;if(n>=120)stopRec(true)},500)};render()},
recsend:function(){stopRec(true)},reccancel:function(){stopRec(false)},
adduser:function(u){var id='c'+Date.now();if(commit(function(){S.chats.push({id:id,name:u,u:u,msgs:[]})})){view.chat=id;render()}},
newvideo:function(){var f=$('#file');f.accept='video/*';f.value='';f.onchange=function(){var x=f.files[0];if(!x)return;if(x.size>50*1048576){toast('Video lebih dari 50 MB');return}
modal('Keterangan video (boleh kosong)',function(t){db('readwrite',function(o){o.put({id:'v'+Date.now(),blob:x,text:t,liked:false,at:Date.now()})},function(){view.tab='video';loadVids()})},true)};f.click()},
playpause:function(id){var v=document.querySelector('video[data-id="'+id+'"]');if(v.paused)v.play();else v.pause()},
sound:function(){muted=!muted;document.querySelectorAll('video').forEach(function(v){v.muted=muted});document.querySelectorAll('[data-a=sound]').forEach(function(b){b.textContent=muted?'Suara mati':'Suara aktif'})},
vlike:function(id){var v=find(vids,id);v.liked=!v.liked;db('readwrite',function(o){o.put(v)},function(){var b=document.querySelector('[data-a=vlike][data-id="'+id+'"]');if(b){b.className=v.liked?'liked':'';b.innerHTML=v.liked?'&#9829; Disukai':'&#9825; Suka'}})},
vdel:function(id){if(confirm('Hapus video ini?'))db('readwrite',function(o){o.delete(id)},function(){URL.revokeObjectURL(vurls[id]);delete vurls[id];loadVids()})},
newchat:function(){modal('Nama obrolan baru',function(n){var id='c'+Date.now();commit(function(){S.chats.push({id:id,name:n.slice(0,30),u:slug(n),msgs:[]})});view.chat=id;render()})},
delchat:function(){if(confirm('Hapus obrolan ini?')){commit(function(){S.chats=S.chats.filter(function(c){return c.id!==view.chat})});view.chat=null;render()}},
sendphoto:function(){pick(function(img){send({img:img})})},
newpost:function(){pick(function(img){modal('Keterangan foto (boleh kosong)',function(t){commit(function(){S.posts.unshift({id:'p'+Date.now(),img:img,text:t,liked:false,comments:[],at:Date.now()})});view.tab='feed';render()},true)})},
newstory:function(){pick(function(img){commit(function(){S.stories.push({id:'s'+Date.now(),img:img,at:Date.now()})});render()})},
story:function(id){var s=find(S.stories,id);if(!s)return;storyOpen=id;var e=$('#story');e.innerHTML='<div><b>'+esc(S.me.name)+' &middot; '+time(s.at)+'</b><button data-a="closestory">Tutup</button></div><img alt="Cerita" src="'+s.img+'"><div><span>Hilang setelah 24 jam</span><button data-a="delstory">Hapus</button></div>';e.hidden=false},
closestory:function(){$('#story').hidden=true;storyOpen=null},
delstory:function(){commit(function(){S.stories=S.stories.filter(function(s){return s.id!==storyOpen})});act.closestory();render()},
like:function(id){commit(function(){var p=find(S.posts,id);p.liked=!p.liked});keep()},
delpost:function(id){if(confirm('Hapus foto ini?')){commit(function(){S.posts=S.posts.filter(function(p){return p.id!==id})});keep()}},
avatar:function(){pick(function(img){commit(function(){S.me.photo=img});render()})},
dark:function(){commit(function(){S.dark=!S.dark});render()},
reset:function(){if(confirm('Hapus semua obrolan, foto, dan profil?')){localStorage.removeItem(KEY);db('readwrite',function(o){o.clear()},loadVids);S=seed();migrate();view={tab:'chat',chat:null};render()}}};
function keep(){var y=$('main').scrollTop;render();$('main').scrollTop=y}
function modal(label,cb,allowEmpty){var e=$('#story');e.innerHTML='<form data-f="modal" style="padding:24px;display:flex;flex-direction:column;gap:12px"><label for="mi">'+esc(label)+'</label><input type="text" id="mi" maxlength="200" style="color:#000;background:#fff"><button class="btn">Simpan</button><button type="button" class="ghost" data-a="closestory">Batal</button></form>';e.hidden=false;e.cb=cb;e.allowEmpty=allowEmpty;$('#mi').focus()}
document.addEventListener('click',function(ev){var b=ev.target.closest('[data-a]');if(b)act[b.getAttribute('data-a')](b.getAttribute('data-id'))});
document.addEventListener('submit',function(ev){ev.preventDefault();var f=ev.target,k=f.getAttribute('data-f'),i=f.querySelector('input'),v=i.value.trim();
if(k==='send'){if(v&&send({t:v}))$('#msg').focus()}
else if(k==='comment'){if(v){commit(function(){find(S.posts,f.getAttribute('data-id')).comments.push(v)});keep()}}
else if(k==='profile'){var n=$('#name').value.trim();if(!n){toast('Nama tidak boleh kosong');return}var bio=$('#bio').value.trim(),u=$('#user').value.trim().toLowerCase().replace(/^@/,'');if(!/^[a-z0-9._]{3,20}$/.test(u)){toast('Username 3-20 karakter: huruf, angka, titik, garis bawah');return}if(commit(function(){S.me.user=u;S.me.name=n;S.me.bio=bio})){render();toast('Profil disimpan')}}
else if(k==='modal'){var e=$('#story');if(!v&&!e.allowEmpty)return;e.hidden=true;e.cb(v)}});
document.addEventListener('visibilitychange',function(){if(document.hidden){stopRec(false);document.querySelectorAll('video').forEach(function(v){v.pause()})}});
window.goBack=function(){if(!$('#story').hidden){act.closestory();return true}if(view.chat){act.back();return true}if(view.tab!=='chat'){act.tab('chat');return true}return false};
buildNav();render();loadVids();
</script>
<script src="config.js"></script>
<script src="online.js"></script></body></html>
